<script>
const $=s=>document.querySelector(s);
const C=document.getElementById('c');
const ITEMS=['PLAY','RESUME','MODS','SETTINGS','SAVES','EXTRA','HELP','ABOUT'];
const GOLD='linear-gradient(90deg,#FF9A3C,#FFD08A)',RED='linear-gradient(90deg,#FF6B78,#FFB3BA)',VIO='linear-gradient(90deg,#7A5CFF,#C9B8FF)';
let S=null,sel=0,note='',noteT=0,busy=false,hv=-1;

function fit(){const k=Math.min(innerWidth/1280,innerHeight/800);$('#fit').style.transform='scale('+k+') translate(-50%,-50%)';}
addEventListener('resize',fit);fit();
// fill the screen when opened as an app window (Edge/Chrome remember the last window size and ignore the start flag; a plain tab ignores this)
try{if(screen.availWidth&&(outerWidth<screen.availWidth-8||outerHeight<screen.availHeight-8)){moveTo(0,0);resizeTo(screen.availWidth,screen.availHeight);}}catch(e){}

function view(s){
  const st=s.state, d=s.disc||{};
  const T={
   ready:{pa:'#2BD07F',pb:'#1BA862',ps:'#0B5E34',t:'Ready',s:'Installed on this computer',play:'PLAY',cap:s.mode==='exe'?'In a PC window':'In your browser',dim:1,
     disc:'Found',dw:'100%',db:GOLD,bt:s.built||'Built',bw:'100%',pt:(s.card_sync?'26 / 26':'25 / 26'),pw:(s.card_sync?'100%':'96%'),
     pT:'AUTOSAVE',pB:'Not connected yet',pX:'Autosave details appear once saves are shared.',pN:'Your saves stay in the game meanwhile.',
     dl:'Disc: '+(d.file||'found'),help:s.mode==='exe'?'Start the game in its own window.':'Start the game in your browser.'},
   setup:{pa:'#FFB347',pb:'#E08A1E',ps:'#8A4F06',t:'Not Installed',s:'One-time setup needed',play:'SET UP',cap:'First time only',dim:.4,
     disc:s.disc?'Found':'Not found',dw:s.disc?'100%':'0%',db:GOLD,bt:'Not yet',bw:'0%',pt:'0 / 26',pw:'0%',
     pT:'FIRST TIME',pB:'Press Set up',pX:'You will choose your own Persona 3 FES (USA) .iso.',pN:'About 4.5 GB. It stays on your computer.',
     dl:s.disc?'Disc: '+d.file:'Disc: none found',help:'Choose Set up to find your disc and install.'},
   building:{pa:'#5CA8FF',pb:'#2A6FE0',ps:'#123A8A',t:'Building',s:'You can leave it',play:'BUILDING',cap:'Please wait',dim:.4,
     disc:'Found',dw:'100%',db:GOLD,bt:Math.min(99,Math.round(s.pieces/s.pieces_total*100))+' %',bw:Math.min(100,s.pieces/s.pieces_total*100)+'%',pt:'25 / 26',pw:'96%',
     pT:'PROGRESS',pB:s.pieces+' / about '+s.pieces_total,pX:'Pieces compiled. It carries on if it stops.',pN:'Leave the install window open.',
     dl:'Disc: '+(d.file||'found'),help:'Building your game. The first time takes 10 minutes or more.'},
   wrong:{pa:'#FF6B78',pb:'#D1394A',ps:'#7A1523',t:'Wrong Disc',s:'This copy cannot be used',play:'CHOOSE DISC',cap:'Pick another file',dim:.4,
     disc:'Not usable',dw:'100%',db:RED,bt:'Waiting',bw:'0%',pt:'Waiting',pw:'0%',
     pT:'WHAT TO DO',pB:'Use the original disc',pX:'It must be Persona 3 FES (USA), not modified.',pN:'Your disc is never changed or uploaded.',
     dl:'Disc: '+(d.file||'?'),help:'This disc image is not a supported copy. Choose another.'}
  }[st];
  if(st==='ready'){const pa=s.pc_autosaves&&s.pc_autosaves.available&&s.mode==='exe'?s.pc_autosaves:s.autosaves, n=pa&&pa.list?pa.list.length:0;
    if(n){T.pB=n+' saved';T.pX='Newest: '+pa.list[0].when;T.pN='Resume picks up where you left off.';}
    else{T.pB='None yet';T.pX='They appear as you play.';T.pN='Saved every few minutes while you play.';}}
  let why=null;
  const gid=d.game_id||'not found', reg=d.region||'unknown', gshow=d.game_id?gid.replace('_','-').replace('.',''):'Not found';
  if(st==='wrong'){
    if(s.reason==='region'){T.s='Wrong region';T.dl+=' · region '+reg;T.help='This is not the USA version. Choose the USA disc.';T.pB='Use the USA disc';T.pX='Only Persona 3 FES (USA, NTSC-U) works.';
      why=[[reg+' · needs NTSC-U','NO'],[gshow+' · needs SLUS-21621','NO'],['Not checked','—']];}
    else if(s.reason==='modded'){T.s='Disc has been changed';T.dl+=' · modified';T.help='This image was altered. Use an untouched copy of your disc.';T.pB='Use the original disc';T.pX='Mods are added later, to a separate copy.';
      why=[['NTSC-U','OK'],['SLUS-21621','OK'],['Differs from the original','NO']];}
    else{T.s='Disc file is damaged';T.dl+=' · incomplete';T.help='The file ends early or cannot be read. Copy the disc again.';T.pB='Copy the disc again';T.pX='The dump stopped part way or has read errors.';
      why=[[d.region||'Not found',d.region==='NTSC-U'?'OK':'—'],[gshow,d.game_id?'OK':'—'],['File ends early or unreadable','NO']];}
  }
  return {T,why};
}
const badge=g=>g==='OK'?'#2BD07F':g==='NO'?'#FF6B78':'#8FA6C9';

const TVFRAME=`<div style="position:relative;width:150px;height:124px;margin:0 auto"><svg width="150" height="124" viewBox="0 0 150 124" style="position:absolute;left:0;top:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))"><path d="M55 30L38 6M95 30l17-24" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/><rect x="8" y="26" width="134" height="92" rx="14" fill="var(--deep)" stroke="var(--acc)" stroke-width="3"/><rect x="20" y="36" width="110" height="72" rx="8" fill="#0B1A3F"/></svg><div id="tvslot" style="position:absolute;left:20px;top:36px;width:110px;height:72px;border-radius:8px;overflow:hidden"></div><svg width="150" height="124" viewBox="0 0 150 124" style="position:absolute;left:0;top:0"><rect x="20" y="36" width="110" height="72" rx="8" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/></svg></div>`;
// The TV screen is one canvas that lives outside the page redraws, so its picture keeps moving. Normally it is static;
// when the computer is playing at midnight it shows a short teaser instead (?midnight=1 in the address previews it).
const tvCanvas=document.createElement('canvas');tvCanvas.width=220;tvCanvas.height=144;tvCanvas.style.cssText='width:110px;height:72px;display:block';
const tvNoise=document.createElement('canvas');tvNoise.width=55;tvNoise.height=36;
const tvT0=performance.now();
function localDate(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isMidnight(){if(/[?&]midnight=1/.test(location.search))return true;const h=new Date().getHours();if(!S)return false;if(h===0&&S.playing)return true;return !!(S.midnight_date&&S.midnight_date===localDate()&&h<3);}
function tvStatic(ctx,alpha){const n=tvNoise.getContext('2d'),im=n.createImageData(55,36),roll=((performance.now()/9)%60)-12;
  for(let y=0;y<36;y++)for(let x=0;x<55;x++){const i=(y*55+x)*4,v=Math.random()*255,bar=Math.max(0,1-Math.abs(y-roll)/6)*60;im.data[i]=Math.min(255,v*.85+bar);im.data[i+1]=Math.min(255,v*.92+bar);im.data[i+2]=Math.min(255,v+bar);im.data[i+3]=255;}
  n.putImageData(im,0,0);ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;ctx.drawImage(tvNoise,0,0,220,144);ctx.globalAlpha=1;}
function tvText(ctx,lines,size,a){ctx.globalAlpha=a;ctx.font='800 '+size+'px Lexend,Segoe UI,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const gl=Math.random()<.22?(Math.random()*6-3):0,y0=72-(lines.length-1)*size*.6;
  lines.forEach((s,i)=>{const y=y0+i*size*1.2;if(gl){ctx.fillStyle='#ff3b55';ctx.fillText(s,110+gl+2,y);ctx.fillStyle='#35e0ff';ctx.fillText(s,110-gl-2,y);}ctx.fillStyle='#f4fbff';ctx.fillText(s,110,y);});ctx.globalAlpha=1;}
function tvFrame(){if(!document.body.contains(tvCanvas))return;const ctx=tvCanvas.getContext('2d');
  if(!isMidnight()){tvStatic(ctx,1);}else{
    const t=((performance.now()-tvT0)/1000)%10;ctx.fillStyle='#02060f';ctx.fillRect(0,0,220,144);
    const seg=(a,b)=>t>=a&&t<b?Math.min(1,(t-a)/.25,(b-t)/.25):0;
    tvStatic(ctx,t<1||t>=8.4?(t<1?1-t*.3:Math.min(1,(t-8.4)*.6)):.12);
    if(Math.random()>.07){
      let a=seg(1.2,3.1);if(a>0)tvText(ctx,['MIDNIGHT','CHANNEL'],30,a);
      a=seg(3.3,5.3);if(a>0)tvText(ctx,['PERSONA 4'],34,a);
      a=seg(5.5,7.9);if(a>0)tvText(ctx,['THE RECOMP','IS COMING'],27,a);}
  }
  ctx.fillStyle='rgba(0,0,0,.18)';for(let y=0;y<144;y+=4)ctx.fillRect(0,y,220,2);}
setInterval(tvFrame,83);
function renderHome(){
  if(lost){C.innerHTML='<div class="a" style="left:0;top:340px;width:1280px;text-align:center;font-size:26px;font-weight:800">The launcher has stopped.<div style="font-size:16px;font-weight:600;margin-top:12px">Close this window and open launch.bat again.</div></div>';return;}
  if(!S){C.innerHTML='<div class="a" style="left:0;top:370px;width:1280px;text-align:center;font-size:24px;font-weight:800">Starting…</div>';return;}
  const {T,why}=view(S), n=new Date(), dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n.getDay()];
  const dc=dn==='Sun'?'#FF6B78':dn==='Sat'?'#6AB4FF':'#fff';
  const ready=S.state==='ready', exe=S.mode==='exe';
  const on=x=>x?'background:var(--deep);color:var(--acc);border-color:var(--acc)':'background:var(--btn);color:var(--fg,#fff);border-color:rgba(255,255,255,.35)';
  const top=i=>164+i*44;
  let h=`<div class="a ring"></div><div class="a ticks"></div><div class="a moon"></div><div class="a curve"></div><div class="a stripe"></div>
  <div class="a title">LAUNCHER</div><div class="a sub">FOR PERSONA 3 FES</div>${S.journey?'<div class="badge">THE JOURNEY · COMPLETE</div>':''}
  <div class="a plate" style="background:linear-gradient(100deg,transparent 0%,${T.pa} 38%,${T.pb} 100%)"></div>
  <div class="a date"><span>${String(n.getMonth()+1).padStart(2,'0')}/${String(n.getDate()).padStart(2,'0')}</span><span style="color:${dc}">${dn}</span></div>
  <div class="a pt"><div class="t" style="text-shadow:2px 2px 0 ${T.ps},0 0 12px rgba(5,32,70,.6)">${T.t}</div><div class="s" style="text-shadow:1px 1px 0 ${T.ps},0 0 10px rgba(5,32,70,.6)">${T.s}</div></div>
  <div class="a bar" style="top:${top(sel)}px;height:44px"></div>`;
  ITEMS.forEach((it,i)=>{
    const y=top(i), lab=i===0?T.play:it, op=(i!==1&&i!==2)?1:T.dim, s=i===sel;
    h+=`<div class="a sq" style="top:${y+10}px;background:${s?'var(--acc)':'var(--deep)'};opacity:${s?1:op}"></div>
    <div class="a it${s?' sel':''}" style="top:${y}px;height:44px;line-height:44px;opacity:${s?1:op}">${lab}</div>
    <div class="a hit" data-i="${i}" style="top:${y}px;height:44px"></div>`;
  });
  h+=`<div class="a cap" style="top:${top(sel)}px;height:44px">${sel===0?T.cap:''}</div>`;
  h+=`<div class="a" style="left:905px;top:270px;width:190px;text-align:center;pointer-events:none;opacity:.92">${TVFRAME}<div style="font-size:11px;letter-spacing:3px;font-weight:800;margin-top:6px;color:var(--ink)">${isMidnight()?'MIDNIGHT CHANNEL':'TO BE CONTINUED'}</div></div>`;
  h+=`<div class="a sw" style="display:${ready?'flex':'none'}"><div class="l">PLAY IN</div><div class="b" data-m="browser" style="${on(!exe)}">BROWSER</div><div class="b" data-m="exe" style="${on(exe)}">PC WINDOW</div><div class="k">Q / E</div></div>`;
  h+=`<div class="a panel" style="left:112px;top:536px;width:540px;height:150px">
   <div style="font-size:22px;font-weight:800;color:var(--ink)">Persona 3 FES <span style="font-size:14px;font-weight:600">NTSC-U</span></div>
   <div class="row" style="margin-top:8px"><div>DISC</div><div>${T.disc}</div><div class="trk"><div style="width:${T.dw};background:${T.db}"></div></div></div>
   <div class="row" style="margin-top:6px"><div>BUILT</div><div>${T.bt}</div><div class="trk"><div style="width:${T.bw};background:${GOLD}"></div></div></div>
   <div class="row" style="margin-top:6px"><div>PATCHES</div><div>${T.pt}</div><div class="trk"><div style="width:${T.pw};background:${VIO}"></div></div></div></div>
  <div class="a panel" style="left:690px;top:536px;width:440px;height:150px">
   <div class="sh" style="font-size:17px;font-weight:800;font-style:italic">${T.pT}</div>
   <div style="font-size:26px;font-weight:800;margin-top:6px;color:var(--ink)">${T.pB}</div>
   <div style="font-size:15px;margin-top:4px;color:var(--ink)">${T.pX}</div>
   <div style="margin-top:8px;font-size:15px;font-weight:600;color:var(--ink)">${T.pN}</div></div>`;
  if(why){h+=`<div class="a panel why" style="left:690px;top:196px;width:500px"><div class="sh" style="font-size:17px;font-weight:800;font-style:italic;padding-bottom:8px">WHY IT WAS REJECTED</div>`+
    ['REGION','GAME ID','CONTENTS'].map((l,i)=>`<div class="rw"><div class="n">${l}</div><div class="v">${why[i][0]}</div><div class="g" style="background:${badge(why[i][1])}">${why[i][1]}</div></div>`).join('')+`</div>`;}
  h+=`<div class="a hb" style="left:112px;top:704px;width:540px;height:32px;font-size:16px"><i></i>${T.dl}</div>
  <div class="a hb" style="left:112px;top:742px;width:660px;height:40px;font-size:20px"><i></i>${note||T.help}</div>
  <div class="a btns"><div class="btn" data-go="1"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#0A3C85"/><path d="M10 10l10 10M20 10l-10 10" stroke="#fff" stroke-width="3"/></svg>Select</div>
  <div class="btn" data-quit="1"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#0A3C85"/><circle cx="15" cy="15" r="6" fill="none" stroke="#FF6B78" stroke-width="3"/></svg>Close</div></div>`;
  C.innerHTML=h;
  const slot=document.getElementById('tvslot');if(slot)slot.appendChild(tvCanvas);
}

let G=null,gq='',gs='new',gp=0,gload=false,gmsg='',D=null,dload=false,dfile=0,dimg=0;
async function gbOpen(id){D=null;dload=true;dfile=0;dimg=0;render();try{D=await api('/api/gb/mod',{id});if(D.ok){const f=D.files.find(x=>x.ok);dfile=f?f.id:0;}}catch(e){D={ok:false,err:'The launcher could not be reached.'};}dload=false;render();}

function updateLog(){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const rows=CHANGES.map(c=>`<div style="margin-top:12px;border-top:1px solid rgba(255,255,255,.3);padding-top:8px"><div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:20px;font-weight:800;color:var(--acc)">${c.v}</span><span style="font-size:16px;font-weight:800;color:var(--ink)">${esc(c.t)}</span><span style="margin-left:auto;font-size:12px;letter-spacing:1px;opacity:.8;color:var(--ink)">${esc(c.d)}</span></div>`+c.i.map(x=>{const m=x.match(/^(NEW|IMPROVED|FIXED)\s+(.*)$/);return `<div style="display:flex;gap:8px;margin-top:5px;font-size:14px;line-height:1.35;color:var(--ink)"><span style="flex:none;width:74px;font-size:11px;font-weight:800;letter-spacing:1px;padding-top:2px;color:${m&&m[1]==='NEW'?'#2BD07F':'var(--acc)'}">${m?m[1]:''}</span><span>${esc(m?m[2]:x)}</span></div>`;}).join('')+`</div>`).join('');
  return pnl(H1('UPDATE LOG')+P('You are on version '+(S?S.version:'')+'.',4)+`<div id="ulist" style="margin-top:2px;max-height:470px;overflow-y:auto;padding-right:6px">${rows}</div>`,'padding-bottom:14px');
}

  const repo=S&&S.update_repo||'', b=(t0,a)=>btnx(t0,a).replace('margin:12px 10px 0 0','margin:6px 10px 0 0');

  if(!repo||UP.edit){

  else h+=P('<b>You have the latest version</b> ('+s.current+').',6)+b('CHECK AGAIN','upc');
  if(UP.msg&&!UP.busy&&!UP.done)h+=P(UP.msg.replace(/</g,'&lt;'),4);

async function wapi(params,wk){const u=WIKIS[wk||'mt'].api+'?'+new URLSearchParams(Object.assign({format:'json',formatversion:'2',origin:'*'},params));const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function gdSaved(){try{const r=await api('/api/guide/list');GD.saved=r.pages||[];}catch(e){GD.saved=[];}render();}
async function gdCats(titles){
  const cat={};
  for(let i=0;i<titles.length;i+=40){
    const c=await wapi({action:'query',prop:'categories',titles:titles.slice(i,i+40).join('|'),cllimit:'max',redirects:'1'});
    ((c.query&&c.query.pages)||[]).forEach(p=>{if(!p.missing)cat[p.title]=(p.categories||[]).map(x=>x.title.replace(/^Category:/,''));});
  }
  return cat;
}
async function gdSearch(q,kw,kc,opt){
  opt=opt||{};q=(q||'').trim();if(!q){say('Type what you want to look up first.');return;}
  GD.last=q;GD.mode='load';GD.msg='';render();
  const pre=s=>/persona\s*3/i.test(s)?s:'Persona 3 '+s;
  try{
    const seen={},all=[];
    for(const qq of (opt.qs||[q])){
      const r=await wapi({action:'query',list:'search',srsearch:pre(qq),srlimit:'40',srnamespace:'0'});
      ((r.query&&r.query.search)||[]).forEach(x=>{if(!seen[x.title]){seen[x.title]=1;all.push(x);}});
    }
    const pins=[];   // pages we expect to exist for this topic: keep the ones that do
    if(opt.pins){const c0=await gdCats(opt.pins);Object.keys(c0).forEach(tt=>{if(!seen[tt]){seen[tt]=1;pins.push({title:tt,snippet:'',pin:1});}});opt.pc=c0;}
    const cat=await gdCats(all.map(x=>x.title).concat(pins.map(x=>x.title)).concat(opt.add||[]));
    const MEDIA=/manga|anthology|live action|stage|movie|drama|novel|soundtrack|weird masquerade|night before|persona q|metaphor|mobile|game and watch|songs?\b|albums?|merchandise|music|\bcd\b|track list/i;
    const VER=/portable|reload|dancing|arena/i, OTHER=/persona [245]\b|persona 5|metaphor|devil survivor|raidou/i;
    const cs=x=>cat[x.title]||[];
    const isP3=x=>{const c=cs(x);
      if(MEDIA.test(x.title)||c.some(n=>MEDIA.test(n))||c.some(n=>/^games?$/i.test(n)))return false;
      if(VER.test(x.title)&&!c.some(n=>/persona 3 fes/i.test(n)))return false;
      if(c.some(n=>/persona 3 fes/i.test(n)))return true;
      const p3=c.filter(n=>/persona 3/i.test(n));
      return p3.length>0&&p3.some(n=>!VER.test(n))&&!c.some(n=>OTHER.test(n));};
    const kr=kw?new RegExp(kw,'i'):null, kcr=kc?new RegExp(kc,'i'):null;
    const mk=x=>{x.cats=cs(x).join(', ');return x;};
    let main=all.map(mk).filter(isP3);
    if(!main.length&&!opt.strict){GD.msg='No Persona 3 pages matched, showing everything the wiki found.';main=all.map(mk);}
    if(opt.strict)main=main.filter(x=>kr&&kr.test(x.title));
    const subpage=x=>/\//.test(x.title)&&!/social link/i.test(q);
    const score=x=>{if(kr&&kr.test(x.title))return x.title.toLowerCase().startsWith(q.toLowerCase())?-1:0;return(kcr&&kcr.test(x.cats||'')?1:2)+(subpage(x)?.5:0);};
    let ranked=main.map((x,i)=>[score(x),i,x]).sort((p,q2)=>p[0]-q2[0]||p[1]-q2[1]);
    if(kr&&ranked.filter(p=>p[0]<2).length>=4)ranked=ranked.filter(p=>p[0]<2);
    let list=pins.map(mk).filter(isP3).concat(ranked.map(p=>p[2]));   // pinned pages must pass the same Persona 3 check
    if(opt.drop)list=list.filter(x=>!opt.drop.includes(x.title));
    (opt.add||[]).forEach(tt=>{if(cat[tt]&&!list.some(x=>x.title===tt))list.push(mk({title:tt,snippet:''}));});
    (opt.extra||[]).slice().reverse().forEach(x=>list.unshift(Object.assign({},x)));
    if(opt.tool&&GD_TOOLS[opt.tool])list.unshift({title:GD_TOOLS[opt.tool].title,snippet:GD_TOOLS[opt.tool].note,cats:'Tool from the community · opens inside the launcher',tool:opt.tool});
    GD.res=list.slice(0,20);GD.fq=opt.fq||'';
    if(!GD.res.length)GD.msg=opt.strict?'The wiki has no page for this that the launcher could find. Try GAMEFAQS IN A WINDOW with the same words.':'Nothing found. Try other words.';
  }catch(e){GD.res=[];GD.msg='Could not reach the wiki ('+e.message+'). You can still open saved pages, or use the buttons that open a window.';}
  GD.mode='results';render();
}
function gdClean(html){
  const d=new DOMParser().parseFromString('<body>'+html,'text/html');
  d.querySelectorAll('noscript').forEach(n=>{const imgs=[...n.querySelectorAll('img')];if(imgs.length){const pv=n.previousElementSibling;if(pv&&pv.tagName==='IMG')pv.remove();n.replaceWith(...imgs);}else n.remove();});
  d.querySelectorAll('script,style,iframe,object,embed,form,link,meta,base,svg,math,.mw-editsection,.toc,#toc').forEach(e=>e.remove());
  d.querySelectorAll('*').forEach(e=>{[...e.attributes].forEach(a=>{if(/^on/i.test(a.name)||a.name==='srcset'||a.name==='style'||a.name==='class'||a.name==='id')e.removeAttribute(a.name);});});
  d.querySelectorAll('img').forEach(i=>{const ds=i.getAttribute('data-src');if(ds){i.setAttribute('src',ds);}let s=i.getAttribute('src')||'';if(s.startsWith('//'))s='https:'+s;if(s.startsWith('data:'))i.remove();else{i.setAttribute('src',s);i.setAttribute('referrerpolicy','no-referrer');}i.removeAttribute('data-src');i.removeAttribute('loading');});
  d.querySelectorAll('a').forEach(a=>{const h=a.getAttribute('href')||'';a.removeAttribute('href');a.removeAttribute('target');
    const m=h.match(/^(?:https?:\/\/[a-z0-9-]+\.fandom\.com)?\/wiki\/([^#?]+)/);
    if(m&&!/:/.test(decodeURIComponent(m[1]))){a.setAttribute('data-wt',decodeURIComponent(m[1]).replace(/_/g,' '));}
    else if(/^https?:/.test(h)){a.setAttribute('data-ext',h);}});

{on:S.widescreen});render();}else if(a.startsWith('sc:')){api('/api/scale',{scale:a.slice(3)});S.scale=a.slice(3);render();}else if(a.startsWith('jy:')){api('/api/journey',{on:a==='jy:1'}).then(()=>{if(a==='jy:1')S.journey=true;else{S.journey=false;if(S.theme==='twelve')S.theme='blue';}applyTheme();render();});}else if(a.startsWith('th:')){S.theme=a.slice(3);applyTheme();api('/api/theme',{theme:a.slice(3)});render();}else if(a.startsWith('br:')){api('/api/browser',{browser:a.slice(3)});S.browser=a.slice(3);render();}}

C.addEventListener('mouseover',e=>{
  const m=e.target.closest('[data-mi]');
  if(m){hv=+m.dataset.mi;const b=document.getElementById('hvb');if(b&&screen!=='home'){b.style.top=(MENUS[screen].y+hv*56)+'px';b.style.opacity=1;}return;}
  const t=e.target.closest('[data-i]');
  if(!t||busy){ if(hv>=0){hv=-1;const b=document.getElementById('hvb');if(b)b.style.opacity=0;} return;}
  const i=+t.dataset.i; if(i!==sel){sel=i;render();}
});
C.addEventListener('mouseleave',()=>{hv=-1;const b=document.getElementById('hvb');if(b)b.style.opacity=0;});
C.addEventListener('mouseout',e=>{ if(e.target.closest('[data-mi]')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-mi]'))){hv=-1;const b=document.getElementById('hvb');if(b)b.style.opacity=0;}});
function volSet(w,v){S['vol_'+w]=Math.max(0,Math.min(100,isNaN(v)?100:v));if(w==='launcher')musicSync();api('/api/volume',{which:w,v:S['vol_'+w]}).then(r=>{if(r&&r.v!==undefined&&r.v!==S['vol_'+w]){S['vol_'+w]=r.v;render();}});render();}
function volCommit(el){if(!el||!el.dataset.w)return;const n=parseInt(el.value,10);volSet(el.dataset.w,isNaN(n)?(S['vol_'+el.dataset.w]!=null?S['vol_'+el.dataset.w]:100):n);}
addEventListener('input',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.sl){const n=document.getElementById('vl-'+el.dataset.sl);if(n)n.value=el.value;}});
addEventListener('change',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.sl)volSet(el.dataset.sl,parseInt(el.value,10));});
addEventListener('keydown',e=>{
  if((e.key==='m'||e.key==='M')&&!(e.target&&e.target.tagName==='INPUT')&&!e.ctrlKey&&!e.altKey&&S){const cur=S.vol_launcher!=null?S.vol_launcher:70;S.vprev=S.vprev||{};if(cur>0){S.vprev.launcher=cur;volSet('launcher',0);say('Launcher music muted. Press M to turn it back on.');}else{volSet('launcher',S.vprev.launcher||70);say('Launcher music on.');}render();return;}
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'){if(e.target.id==='gdq'){GD.q=e.target.value;gdSearch(GD.q);}else if(e.target.id==='uprepo'){document.querySelector('[data-act=uprs]').click();}else volCommit(e.target);}return;}
  if(screen!=='home'&&S){
    if(capture){e.preventDefault();if(e.key==='Escape'){capture=null;render();return;}const k=SDLKEY(e);if(!k){say('That key cannot be used. Try another.');return;}const r=capture;capture=null;setKey(r,k);return;}
    const n=MENUS[screen].items.length;
    if(e.key==='ArrowDown'){msel=(msel+1)%n;render();}else if(e.key==='ArrowUp'){msel=(msel+n-1)%n;render();}
    else if(e.key==='Escape'||e.key==='Backspace')back();
    return;
  }
  if(e.key==='ArrowDown'){sel=(sel+1)%ITEMS.length;render();}
  else if(e.key==='ArrowUp'){sel=(sel+ITEMS.length-1)%ITEMS.length;render();}
  else if(e.key==='Enter'||e.key===' '){go();}
  else if(e.key==='q'||e.key==='Q')setMode('browser');
  else if(e.key==='e'||e.key==='E')setMode('exe');
  else if(e.key==='Escape')window.close();
});
addEventListener('pagehide',()=>{try{navigator.sendBeacon('/api/bye');}catch(e){}});
refresh();setInterval(refresh,3000);setInterval(()=>{if(screen==='log'&&msel===0)lgLoad();},2000);
