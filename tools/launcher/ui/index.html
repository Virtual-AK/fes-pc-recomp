<script>
const $=s=>document.querySelector(s);
const C=document.getElementById('c');
const ITEMS=['PLAY','RESUME','MODS','SETTINGS','SAVES','LOG','HELP','ABOUT'];
const GOLD='linear-gradient(90deg,#FF9A3C,#FFD08A)',RED='linear-gradient(90deg,#FF6B78,#FFB3BA)',VIO='linear-gradient(90deg,#7A5CFF,#C9B8FF)';
let S=null,sel=0,note='',noteT=0,busy=false,hv=-1;

function fit(){const k=Math.min(innerWidth/1280,innerHeight/800);$('#fit').style.transform='scale('+k+') translate(-50%,-50%)';}
addEventListener('resize',fit);fit();
// fill the screen when opened as an app window (Edge/Chrome remember the last window size and ignore the start flag; a plain tab ignores this)
try{if(screen.availWidth&&(outerWidth<screen.availWidth-8||outerHeight<screen.availHeight-8)){moveTo(0,0);resizeTo(screen.availWidth,screen.availHeight);}}catch(e){}

function view(s){
  const st=s.state, d=s.disc||{};
  const T={
   ready:{pa:'#2BD07F',pb:'#1BA862',ps:'#0B5E34',t:'Ready',s:'Installed on this computer',play:'PLAY',cap:s.mode==='exe'?'In a PC window':'In your browser',dim:1,
     disc:'Found',dw:'100%',db:GOLD,bt:s.built||'Built',bw:'100%',pt:(s.card_sync?'26 / 26':'25 / 26'),pw:(s.card_sync?'100%':'96%'),
     pT:'AUTOSAVE',pB:'Not connected yet',pX:'Autosave details appear once saves are shared.',pN:'Your saves stay in the game meanwhile.',
     dl:'Disc: '+(d.file||'found'),help:s.mode==='exe'?'Start the game in its own window.':'Start the game in your browser.'},
   setup:{pa:'#FFB347',pb:'#E08A1E',ps:'#8A4F06',t:'Not Installed',s:'One-time setup needed',play:'SET UP',cap:'First time only',dim:.4,
     disc:s.disc?'Found':'Not found',dw:s.disc?'100%':'0%',db:GOLD,bt:'Not yet',bw:'0%',pt:'0 / 26',pw:'0%',
     pT:'FIRST TIME',pB:'Press Set up',pX:'You will choose your own Persona 3 FES (USA) .iso.',pN:'About 4.5 GB. It stays on your computer.',
     dl:s.disc?'Disc: '+d.file:'Disc: none found',help:'Choose Set up to find your disc and install.'},
   building:{pa:'#5CA8FF',pb:'#2A6FE0',ps:'#123A8A',t:'Building',s:'You can leave it',play:'BUILDING',cap:'Please wait',dim:.4,
     disc:'Found',dw:'100%',db:GOLD,bt:Math.min(99,Math.round(s.pieces/s.pieces_total*100))+' %',bw:Math.min(100,s.pieces/s.pieces_total*100)+'%',pt:'25 / 26',pw:'96%',
     pT:'PROGRESS',pB:s.pieces+' / about '+s.pieces_total,pX:'Pieces compiled. It carries on if it stops.',pN:'Leave the install window open.',
     dl:'Disc: '+(d.file||'found'),help:'Building your game. The first time takes 10 minutes or more.'},
   wrong:{pa:'#FF6B78',pb:'#D1394A',ps:'#7A1523',t:'Wrong Disc',s:'This copy cannot be used',play:'CHOOSE DISC',cap:'Pick another file',dim:.4,
     disc:'Not usable',dw:'100%',db:RED,bt:'Waiting',bw:'0%',pt:'Waiting',pw:'0%',
     pT:'WHAT TO DO',pB:'Use the original disc',pX:'It must be Persona 3 FES (USA), not modified.',pN:'Your disc is never changed or uploaded.',
     dl:'Disc: '+(d.file||'?'),help:'This disc image is not a supported copy. Choose another.'}
  }[st];
  if(st==='ready'){const pa=s.pc_autosaves&&s.pc_autosaves.available&&s.mode==='exe'?s.pc_autosaves:s.autosaves, n=pa&&pa.list?pa.list.length:0;
    if(n){T.pB=n+' saved';T.pX='Newest: '+pa.list[0].when;T.pN='Resume picks up where you left off.';}
    else{T.pB='None yet';T.pX='They appear as you play.';T.pN='Saved every few minutes while you play.';}}
  let why=null;
  const gid=d.game_id||'not found', reg=d.region||'unknown', gshow=d.game_id?gid.replace('_','-').replace('.',''):'Not found';
  if(st==='wrong'){
    if(s.reason==='region'){T.s='Wrong region';T.dl+=' · region '+reg;T.help='This is not the USA version. Choose the USA disc.';T.pB='Use the USA disc';T.pX='Only Persona 3 FES (USA, NTSC-U) works.';
      why=[[reg+' · needs NTSC-U','NO'],[gshow+' · needs SLUS-21621','NO'],['Not checked','—']];}
    else if(s.reason==='modded'){T.s='Disc has been changed';T.dl+=' · modified';T.help='This image was altered. Use an untouched copy of your disc.';T.pB='Use the original disc';T.pX='Mods are added later, to a separate copy.';
      why=[['NTSC-U','OK'],['SLUS-21621','OK'],['Differs from the original','NO']];}
    else{T.s='Disc file is damaged';T.dl+=' · incomplete';T.help='The file ends early or cannot be read. Copy the disc again.';T.pB='Copy the disc again';T.pX='The dump stopped part way or has read errors.';
      why=[[d.region||'Not found',d.region==='NTSC-U'?'OK':'—'],[gshow,d.game_id?'OK':'—'],['File ends early or unreadable','NO']];}
  }
  return {T,why};
}
const badge=g=>g==='OK'?'#2BD07F':g==='NO'?'#FF6B78':'#8FA6C9';

function renderHome(){
  if(lost){C.innerHTML='<div class="a" style="left:0;top:340px;width:1280px;text-align:center;font-size:26px;font-weight:800">The launcher has stopped.<div style="font-size:16px;font-weight:600;margin-top:12px">Close this window and open launch.bat again.</div></div>';return;}
  if(!S){C.innerHTML='<div class="a" style="left:0;top:370px;width:1280px;text-align:center;font-size:24px;font-weight:800">Starting…</div>';return;}
  const {T,why}=view(S), n=new Date(), dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][n.getDay()];
  const dc=dn==='Sun'?'#FF6B78':dn==='Sat'?'#6AB4FF':'#fff';
  const ready=S.state==='ready', exe=S.mode==='exe';
  const on=x=>x?'background:var(--deep);color:var(--acc);border-color:var(--acc)':'background:var(--btn);color:var(--fg,#fff);border-color:rgba(255,255,255,.35)';
  const top=i=>164+i*44;
  let h=`<div class="a ring"></div><div class="a ticks"></div><div class="a moon"></div><div class="a curve"></div><div class="a stripe"></div>

async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return r.json();}
let lost=false;
function applyTheme(){document.documentElement.setAttribute('data-theme',(S&&S.theme)||'blue');}
async function refresh(){try{S=await api('/api/state');lost=false;}catch(e){lost=true;if(!S)S=null;}applyTheme();render();}
async function setMode(m){if(!S||S.state!=='ready')return;await api('/api/mode',{mode:m});S.mode=m;render();}
async function go(){
  if(!S||busy)return;
  if(sel===0){
    if(S.state==='ready'){busy=true;say('Starting…');const r=await api('/api/play',{mode:S.mode});busy=false;say(r.msg||'');}
    else{open_('setup');msel=Math.max(0,setupSteps().indexOf('NOW'));render();}
  }else if(sel===1){
    const PL=S&&S.pc_autosaves&&S.pc_autosaves.available?S.pc_autosaves.list:null;
    if(S.mode==='exe'&&PL){
      if(!PL.length)say('No PC window autosaves yet. Play in the PC window first.');
      else{busy=true;say('Starting…');const r=await api('/api/play',{mode:'exe',pcresume:PL[0].id});busy=false;say(r.msg||'');}
      return;
    }
    const L=S&&S.autosaves?S.autosaves.list:[];
    if(!L.length)say('No autosaves yet. Play in the browser first.');
    else{busy=true;say('Starting…');const r=await api('/api/play',{mode:'browser',resume:String(L[0].id)});busy=false;say(r.msg||'');}
  }else if(sel===2)open_('mods');else if(sel===3)open_('settings');else if(sel===6)open_('help');else if(sel===7)open_('about');else if(sel===4)open_('saves');else if(sel===5)openLog();
  else say(ITEMS[sel][0]+ITEMS[sel].slice(1).toLowerCase()+' is not built yet.');
}
C.addEventListener('click',e=>{
  const t=e.target.closest('[data-i],[data-m],[data-go],[data-quit],[data-mi],[data-back],[data-act],[data-key],[data-voice]'); if(!t)return;
  if(t.dataset.voice){const [a,n]=t.dataset.voice.split('|');playVoice(a,n);return;}
  if(t.dataset.mi!==undefined){msel=+t.dataset.mi;capture=null;reportText='';pend='';render();}
  else if(t.dataset.back)back();
  else if(t.dataset.key){capture=t.dataset.key;render();}
  else if(t.dataset.act){const a=t.dataset.act;if(a==='lgclear'){api('/api/dialoglog/clear',{}).then(()=>{lgLoad();say('Log cleared.');});}else if(a==='report')report();else if(a==='resetkeys')resetKeys();else if(a.startsWith('ast:')){astab=a.slice(4);render();}else if(a.startsWith('rp:')){busy=true;say('Starting…');api('/api/play',{mode:'exe',pcresume:a.slice(3)}).then(r=>{busy=false;say(r.msg||'');});}else if(a.startsWith('dp:')){if(pend!==a){pend=a;render();}else{pend='';api('/api/pcsave/delete',{id:a.slice(3)}).then(r=>{say(r.msg||'');refresh();});}}else if(a.startsWith('pe:')||a.startsWith('pk:')||a.startsWith('pc:')){const v=a.slice(3),c=S.pc_autosaves.cfg;if(a[1]==='e')c.every=+v;else if(a[1]==='k')c.keep=+v;else c.card=v==='1';api('/api/pcautosave',{every:String(c.every),keep:String(c.keep),card:c.card});render();}else if(a==='sethome')back();else if(a==='choosemod'){say('Choose a patch file in the file window…');api('/api/mod/choose',{}).then(r=>{say(r.msg||'');refresh();});}else if(a==='playmod'){busy=true;say('Starting…');api('/api/play',{mode:S.mode,mod:true}).then(r=>{busy=false;say(r.msg||'');});}else if(a==='choosedisc'){say('Choose your disc in the file window…');api('/api/disc/choose',{}).then(r=>{say(r.msg||'');refresh();});}else if(a==='startsetup'){api('/api/setup/start',{}).then(r=>{say(r.msg||'');refresh();});}else if(a.startsWith('ra:')){busy=true;say('Starting…');api('/api/play',{mode:'browser',resume:a.slice(3)}).then(r=>{busy=false;say(r.msg||'');});}else if(a.startsWith('da:')){if(pend!==a){pend=a;render();}else{pend='';api('/api/autosave/delete',{id:a.slice(3)}).then(r=>{say(r.msg||'');refresh();});}}else if(a.startsWith('rs:')||a.startsWith('dl:')){if(pend!==a){pend=a;render();}else{pend='';const name=a.slice(3);api(a.startsWith('rs:')?'/api/card/restore':'/api/card/delete',{name}).then(r=>{say(r.msg||'');refresh();});}}else if(a.startsWith('lma:')){say('Choose it in the file window…');api('/api/lmod/add',{kind:a.slice(4)}).then(r=>{say(r.msg||'');refresh();});}else if(a.startsWith('gbs:')){gs=a.slice(4);gp=0;gbLoad(false);}else if(a.startsWith('gbp:')){gp=Math.max(0,gp+(+a.slice(4)));gbLoad(false);}else if(a==='gbq'){const q=prompt('Search mods by name, author or type (leave empty to clear):',gq);if(q!==null){gq=q.trim();gp=0;gbLoad(false);}}else if(a==='gbr'){gbLoad(true);}else if(a.startsWith('gbd:')){gbOpen(+a.slice(4));}else if(a==='gbb'){D=null;dload=false;render();}else if(a.startsWith('gbf:')){dfile=+a.slice(4);render();}else if(a.startsWith('gbm:')){dimg=+a.slice(4);render();}else if(a.startsWith('gbi:')){const q=a.split(':');api('/api/gb/install',{id:+q[1],file:+q[2]}).then(r=>{say(r.msg||'');refresh();});}else if(a.startsWith('lmu:')){api('/api/lmod/up',{id:a.slice(4)}).then(r=>{say(r.msg||'');refresh();});}else if(a.startsWith('lmt:')){api('/api/lmod/toggle',{id:a.slice(4)}).then(r=>{say(r.msg||'');refresh();});}else if(a.startsWith('lmr:')){if(pend!==a){pend=a;render();}else{pend='';api('/api/lmod/remove',{id:a.slice(4)}).then(r=>{say(r.msg||'');refresh();});}}else if(a==='openfolder'){api('/api/openfolder',{}).then(r=>{if(!r.ok)say(r.msg);});}else if(a.startsWith('ws:')){S.widescreen=a==='ws:1';api('/api/widescreen',{on:S.widescreen});render();}else if(a.startsWith('sc:')){api('/api/scale',{scale:a.slice(3)});S.scale=a.slice(3);render();}else if(a.startsWith('jy:')){api('/api/journey',{on:a==='jy:1'}).then(()=>{if(a==='jy:1')S.journey=true;else{S.journey=false;if(S.theme==='twelve')S.theme='blue';}applyTheme();render();});}else if(a.startsWith('th:')){S.theme=a.slice(3);applyTheme();api('/api/theme',{theme:a.slice(3)});render();}else if(a.startsWith('br:')){api('/api/browser',{browser:a.slice(3)});S.browser=a.slice(3);render();}}
  else if(t.dataset.i!==undefined){sel=+t.dataset.i;render();go();}
  else if(t.dataset.m)setMode(t.dataset.m);
  else if(t.dataset.go)go();
  else if(t.dataset.quit)window.close();
});
C.addEventListener('mouseover',e=>{
  const m=e.target.closest('[data-mi]');
  if(m){hv=+m.dataset.mi;const b=document.getElementById('hvb');if(b&&screen!=='home'){b.style.top=(MENUS[screen].y+hv*56)+'px';b.style.opacity=1;}return;}
  const t=e.target.closest('[data-i]');
  if(!t||busy){ if(hv>=0){hv=-1;const b=document.getElementById('hvb');if(b)b.style.opacity=0;} return;}
  const i=+t.dataset.i; if(i!==sel){sel=i;render();}
});
C.addEventListener('mouseleave',()=>{hv=-1;const b=document.getElementById('hvb');if(b)b.style.opacity=0;});
C.addEventListener('mouseout',e=>{ if(e.target.closest('[data-mi]')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-mi]'))){hv=-1;const b=document.getElementById('hvb');if(b)b.style.opacity=0;}});
addEventListener('keydown',e=>{
  if(screen!=='home'&&S){
    if(capture){e.preventDefault();if(e.key==='Escape'){capture=null;render();return;}const k=SDLKEY(e);if(!k){say('That key cannot be used. Try another.');return;}const r=capture;capture=null;setKey(r,k);return;}
    const n=MENUS[screen].items.length;
    if(e.key==='ArrowDown'){msel=(msel+1)%n;render();}else if(e.key==='ArrowUp'){msel=(msel+n-1)%n;render();}
    else if(e.key==='Escape'||e.key==='Backspace')back();
    return;
  }
  if(e.key==='ArrowDown'){sel=(sel+1)%ITEMS.length;render();}
  else if(e.key==='ArrowUp'){sel=(sel+ITEMS.length-1)%ITEMS.length;render();}
  else if(e.key==='Enter'||e.key===' '){go();}
  else if(e.key==='q'||e.key==='Q')setMode('browser');
  else if(e.key==='e'||e.key==='E')setMode('exe');
  else if(e.key==='Escape')window.close();
});
addEventListener('pagehide',()=>{try{navigator.sendBeacon('/api/bye');}catch(e){}});
refresh();setInterval(refresh,3000);setInterval(()=>{if(screen==='log')lgLoad();},2000);
</script></body></html>
